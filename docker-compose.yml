services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-toast_timer}
      - DB_USER=${DB_USER:-toast}
      - DB_PASSWORD=${DB_PASSWORD:-toast123}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure:3

  db:
    build:
      context: .
      dockerfile: Dockerfile-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-toast_timer}
      MYSQL_USER: ${DB_USER:-toast}
      MYSQL_PASSWORD: ${DB_PASSWORD:-toast123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
