<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320" role="img" aria-label="Rehearsal loop">
<rect width="1100" height="320" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647488"/></marker></defs>
<rect x="30" y="110" rx="14" width="170" height="100" fill="#0F2D5B"/>
<text x="115" y="167" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" fill="#ffffff">1. Plan the time</text>
<line x1="202" y1="160" x2="236" y2="160" stroke="#647488" stroke-width="3" marker-end="url(#a)"/>
<rect x="240" y="110" rx="14" width="170" height="100" fill="#1566BB"/>
<text x="325" y="167" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" fill="#ffffff">2. Run it aloud</text>
<line x1="412" y1="160" x2="446" y2="160" stroke="#647488" stroke-width="3" marker-end="url(#a)"/>
<rect x="450" y="110" rx="14" width="170" height="100" fill="#22c55e"/>
<text x="535" y="167" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" fill="#ffffff">3. Read the colour</text>
<line x1="622" y1="160" x2="656" y2="160" stroke="#647488" stroke-width="3" marker-end="url(#a)"/>
<rect x="660" y="110" rx="14" width="170" height="100" fill="#eab308"/>
<text x="745" y="167" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" fill="#ffffff">4. Adjust</text>
<line x1="832" y1="160" x2="866" y2="160" stroke="#647488" stroke-width="3" marker-end="url(#a)"/>
<rect x="870" y="110" rx="14" width="170" height="100" fill="#ef4444"/>
<text x="955" y="167" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" fill="#ffffff">5. Repeat</text>
<path d="M 1000 215 Q 1000 290 535 290 Q 115 290 115 215" fill="none" stroke="#647488" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>
<text x="550" y="40" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#0F2D5B">The rehearsal loop</text>
<text x="550" y="312" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">Stop when two runs in a row end in green or yellow</text>
</svg>