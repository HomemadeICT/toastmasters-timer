<text x="1040.0" y="66" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#1e293b">RED 7:00</text>
<text x="60.0" y="262" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">0:00</text>
<text x="200.0" y="262" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">1:00</text>
<text x="340.0" y="262" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">2:00</text>
